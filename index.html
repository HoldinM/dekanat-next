.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ro);margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:9;max-width:90%}

function nextLesson(){const n=new Date(),now=n.getHours()*60+n.getMinutes();
 for(let o=0;o<8;o++){const d=addD(n,o),L=lessons(me.id,d.getDay()).filter(l=>!(l[6]||"").startsWith("x"));
  const l=L.find(l=>o>0||tm(l[1])>now);if(l)return{l,o,d,live:o===0&&tm(l[0])<=now,left:tm(l[0])-now,endIn:tm(l[1])-now}}return null}
const dur=m=>m>=60?`${Math.floor(m/60)} ч${m%60?" "+m%60+" мин":""}`:`${m} мин`;

function ribbon(L){const n=new Date(),now=n.getHours()*60+n.getMinutes(),a=480,w=660;
 return`<div class="rib" role="img" aria-label="Лента дня с 8:00 до 19:00">${L.map(l=>{const f=flag(l);return`<i class="${f?f[0]:""}" style="left:${(tm(l[0])-a)/w*100}%;width:${(tm(l[1])-tm(l[0]))/w*100}%"></i>`}).join("")}${now>=a&&now<=a+w?`<u style="left:${(now-a)/w*100}%"></u>`:""}</div><div class="row mu"><span>8:00</span><span>13:00</span><span>19:00</span></div>`}

/* ---------- успеваемость ---------- */
const mark=(t,p)=>p===null?null:p<55?"не сдано":t==="зачёт"?"зачтено":p>=85?"отлично":p>=70?"хорошо":"удовл.";
function gstats(){const g=GR[me.id]||[],sc=g.filter(x=>x[2]!==null),ok=sc.filter(x=>x[2]>=55);
 return{g,total:g.length,ok:ok.length,avg:sc.length?Math.round(sc.reduce((a,x)=>a+x[2],0)/sc.length):0,debt:sc.filter(x=>x[2]<55),wait:g.filter(x=>x[2]===null)}}

const views={
today(){const n=nextLesson(),L=lessons(me.id,new Date().getDay()),g=gstats(),dl=(DL[me.id]||[])[0],act=myReqs().filter(r=>r.st<2).length;
 const h=new Date().getHours(),hi=h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер";
 let c;
 if(!n)c=`<p class="big">Пар больше нет</p><p class="mu">Ближайшие дни свободны.</p>`;
 else if(n.live)c=`<span class="chip ok">Идёт сейчас</span><p class="big" style="margin:8px 0 2px">${esc(n.l[2])}</p><p class="mu">до ${n.l[1]} · ${esc(n.l[3])} · ${esc(n.l[4])}</p>`;
 else c=`<span class="chip">${n.o===0?`Через ${dur(n.left)}`:n.o===1?"Завтра":fd(n.d)}</span><p class="big" style="margin:8px 0 2px">${esc(n.l[2])}</p><p class="mu">${n.l[0]}–${n.l[1]} · ${esc(n.l[3])} · ${esc(n.l[4])}</p>`;
 return`<h1>${hi}, ${esc(me.name.split(" ")[0])}</h1><p class="mu">${esc(me.group)} · ${new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}</p>
 <div class="card">${c}${n&&n.l[6]&&flag(n.l)[0]==="m"?`<div class="note">${esc(flag(n.l)[1])}</div>`:""}${L.length?ribbon(L):`<p class="mu" style="margin:12px 0 0">Сегодня занятий нет. Отдыхайте.</p>`}</div>
 <div class="grid3"><button class="tile" data-go="news"><span class="mu">Дедлайн</span><b>${dl?dl[1]+" дн":"нет"}</b><span class="mu" style="font-size:12px">${dl?"осталось":"всё сдано"}</span></button>
 <button class="tile" data-go="requests"><span class="mu">Заявки</span><b>${act}</b><span class="mu" style="font-size:12px">в работе</span></button>
 <button class="tile" data-go="grades"><span class="mu">Сессия</span><b>${g.ok}/${g.total}</b><span class="mu" style="font-size:12px">закрыто</span></button></div>
 ${dl?`<h2>Ближайшее</h2><div class="card flat row"><div><b>${esc(dl[0])}</b><div class="mu">до ${fd(addD(new Date(),dl[1]))}</div></div><span class="chip am">${dl[1]} дн</span></div>`:""}
 ${g.debt.length?`<div class="card flat" style="border-color:var(--ro)"><b>Нужна пересдача: ${esc(g.debt[0][0])}</b><div class="mu">Набрано ${g.debt[0][2]} из 100, порог 55. Подайте заявку на пересдачу.</div><button class="btn sm" style="margin-top:10px" data-go="requests">Подать заявку</button></div>`:""}
 <h2>Быстрые действия</h2><div class="row" style="gap:8px"><button class="btn sec" style="flex:1" data-go="requests">Заказать справку</button><button class="btn sec" style="flex:1" data-go="schedule">Неделя</button></div>`},

schedule(){const ds=weekDates();if(selDay===null){const t=new Date().getDay();selDay=t>=1&&t<=5?t-1:0}
 const d=ds[selDay],L=lessons(me.id,d.getDay()),ch=[1,2,3,4,5].reduce((a,w)=>a+lessons(me.id,w).filter(l=>l[6]).length,0);
 return`<h1>Расписание</h1><p class="mu">${ch?`На неделе изменений: ${ch}. Они отмечены в списке.`:"Изменений на неделе нет."}</p>
 <div class="days" role="group" aria-label="День недели">${ds.map((x,i)=>{const c=lessons(me.id,x.getDay()).some(l=>l[6]);return`<button data-d="${i}" aria-pressed="${i===selDay}">${x.toLocaleDateString("ru-RU",{weekday:"short"})}<b>${x.getDate()}</b>${c?`<span class="dot" style="margin:0"></span>`:""}</button>`}).join("")}</div>
 <h2>${d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}</h2>
 ${L.length?L.map(l=>`<div class="card flat">${lessonHTML(l)}</div>`).join(""):`<div class="card"><b>В этот день занятий нет</b><p class="mu" style="margin:4px 0 0">Время для самостоятельной работы или отдыха.</p></div>`}`},

grades(){const s=gstats();
 return`<h1>Успеваемость</h1><div class="card"><div class="row"><div><p class="mu" style="margin:0">Сессия закрыта на</p><p class="big" style="margin:2px 0">${s.ok} из ${s.total}</p></div><div style="text-align:right"><p class="mu" style="margin:0">Средний балл</p><p class="big" style="margin:2px 0">${s.avg}</p></div></div>
 <div class="bar" role="progressbar" aria-valuenow="${s.ok}" aria-valuemax="${s.total}"><i style="width:${s.ok/s.total*100}%"></i></div>
 <p class="mu" style="margin:10px 0 0">${s.debt.length?`Есть долг по предмету «${esc(s.debt[0][0])}». Пересдачу можно заказать в разделе «Заявки».`:s.wait.length?`Осталось сдать: ${s.wait.length}. Ближайший: ${esc(s.wait[0][0])}, ${s.wait[0][3]}.`:"Всё сдано. Отличная сессия."}</p></div>
 ${s.g.map(x=>{const m=mark(x[1],x[2]);return`<div class="card flat"><div class="row"><b>${esc(x[0])}</b>${x[2]===null?`<span class="chip am">${x[3]}</span>`:`<span class="chip ${x[2]<55?"ro":"ok"}">${m}</span>`}</div><div class="mu">${x[1]}${x[2]!==null?` · ${x[2]} из 100`:""}</div>${x[2]!==null?`<div class="bar"><i class="${x[2]<55?"lo":""}" style="width:${x[2]}%"></i></div>`:""}</div>`}).join("")}`},

requests(){
 if(openReq){const r=reqs().find(x=>x.id===openReq&&(me.role==="staff"||x.uid===me.id));
  if(!r)return`<button class="btn sec sm" data-back>Назад</button><div class="card" style="margin-top:12px"><b>Заявка не найдена</b><p class="mu">Такой заявки нет или она вам недоступна.</p></div>`;
  return`<button class="btn sec sm" data-back>Назад</button><h1 style="margin-top:14px">${esc(TYPES[r.type][0])}</h1><p class="mu">Заявка ${r.id} от ${fd(r.created)}${me.role==="staff"?" · "+esc(USERS[r.uid].name):""}</p>
  <div class="card"><ol class="tl">${STEPS.map((s,i)=>`<li class="${i<=r.st?"on":""}"><b>${s}</b><div class="mu">${r.log[i]?ft(r.log[i]):i===r.st+1?"Следующий шаг":"Ожидает"}</div></li>`).join("")}</ol>
  ${r.st===2?`<p class="chip ok">Справка готова: получите электронную копию в этом кабинете</p>`:`<p class="mu" style="margin:0">Срок: ${TYPES[r.type][1]}. Мы сообщим о смене статуса в «Новостях».</p>`}</div>
  ${r.note?`<div class="card flat"><span class="mu">Комментарий</span><div>${esc(r.note)}</div></div>`:""}
  ${me.role==="staff"&&r.st<2?`<button class="btn" data-adv="${r.id}">${r.st===0?"Взять в работу":"Отметить готовой"}</button>`:""}`}
 const L=myReqs().slice().sort((a,b)=>b.created.localeCompare(a.created));
 const list=L.length?L.map(r=>`<button class="card flat" style="width:100%;text-align:left" data-r="${r.id}"><div class="row"><b>${esc(TYPES[r.type][0])}</b><span class="chip ${r.st===2?"ok":r.st===1?"am":""}">${STEPS[r.st]}</span></div><div class="mu">${r.id} · ${fd(r.created)}${me.role==="staff"?" · "+esc(USERS[r.uid].name):""}</div></button>`).join(""):`<div class="card"><b>Заявок пока нет</b><p class="mu" style="margin:4px 0 0">Закажите справку: это займёт минуту.</p></div>`;
 if(me.role==="staff")return`<h1>Очередь заявок</h1><p class="mu">Всего: ${L.length}. Откройте заявку, чтобы сменить статус.</p>${list}`;
 return`<h1>Заявки и справки</h1>
 <div class="card"><h3>Новая заявка</h3><label>Что нужно</label><div class="sel" role="group">${TYPES.map((t,i)=>`<button type="button" data-t="${i}" aria-pressed="${form.type===i}"><b>${t[0]}</b><div class="mu">Срок: ${t[1]}</div></button>`).join("")}</div>
 <label for="cp">Количество копий</label><select id="cp">${[1,2,3].map(n=>`<option ${form.copies===n?"selected":""}>${n}</option>`).join("")}</select>
 <label for="nt">Комментарий (необязательно)</label><textarea id="nt" rows="2" maxlength="300">${esc(form.note)}</textarea>
 <button class="btn" id="sb" style="width:100%;margin-top:14px">Отправить заявку</button></div>
 <h2>Мои заявки</h2>${list}`},

news(){const rs=readSet(),dl=DL[me.id]||[];
 return`<h1>${me.role==="staff"?"Объявления":"Новости и дедлайны"}</h1>
 ${me.role==="staff"?`<div class="card"><h3>Новое объявление</h3><label for="nti">Заголовок</label><input id="nti" maxlength="90"><label for="ntx">Текст</label><textarea id="ntx" rows="3" maxlength="400"></textarea><button class="btn" id="pn" style="margin-top:12px;width:100%">Опубликовать</button></div>`:
 `<h2>Дедлайны</h2>${dl.length?dl.map(x=>`<div class="card flat row"><div><b>${esc(x[0])}</b><div class="mu">до ${fd(addD(new Date(),x[1]))}</div></div><span class="chip ${x[1]<=3?"ro":"am"}">${x[1]} дн</span></div>`).join(""):`<div class="card"><b>Дедлайнов нет</b></div>`}`}
 <h2>Объявления деканата</h2>${news().map(n=>`<details class="card flat" data-n="${n.id}"><summary class="row"><b>${rs.includes(n.id)?"":`<span class="dot" aria-label="Не прочитано"></span>`}${esc(n.t)}</b><span class="mu">${n.d===0?"сегодня":n.d+" дн назад"}</span></summary><p style="margin:10px 0 0">${esc(n.x)}</p></details>`).join("")}`},

profile(){const f=[["Факультет",me.fac],["Направление",me.dir],["Курс",me.course],["Группа",me.group],["Номер зачётки",me.rec]].filter(x=>x[1]!=="");
 return`<h1>${esc(me.name)}</h1><p class="mu">${me.role==="staff"?"Кабинет сотрудника":"Профиль студента"}</p><div class="card">${f.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--ln)"><span class="mu">${x[0]}</span><b style="text-align:right">${esc(x[1])}</b></div>`).join("")}</div>
 <div class="card flat"><b>Безопасность</b><p class="mu" style="margin:4px 0 0">Вы видите только свои данные. Пароль не хранится в открытом виде: сверяется только его солёный хеш.</p></div>
 <button class="btn sec" id="lo" style="width:100%;margin-top:6px">Выйти</button>`}
};

const afters={
 schedule(){document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{selDay=+b.dataset.d;render()})},
 requests(){
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{openReq=b.dataset.r;render()});
  const bk=document.querySelector("[data-back]");if(bk)bk.onclick=()=>{openReq=null;render()};
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{form.type=+b.dataset.t;form.copies=+$("#cp").value;form.note=$("#nt").value;render()});
  const sb=$("#sb");if(sb)sb.onclick=()=>{const a=reqs(),id="Z-"+(1050+a.length),now=new Date().toISOString();
   a.push({id,uid:me.id,type:form.type,copies:+$("#cp").value,note:$("#nt").value.trim(),created:now,st:0,log:[now,null,null]});st.set("dn_req",a);
   form={type:0,copies:1,note:""};openReq=id;toast("Заявка отправлена");render()};
  const ad=document.querySelector("[data-adv]");if(ad)ad.onclick=()=>{if(me.role!=="staff")return;const a=reqs(),r=a.find(x=>x.id===ad.dataset.adv);r.st++;r.log[r.st]=new Date().toISOString();st.set("dn_req",a);toast("Статус обновлён");render()}},
 news(){document.querySelectorAll("details[data-n]").forEach(d=>d.addEventListener("toggle",()=>{if(!d.open)return;const r=readSet(),id=d.dataset.n;if(!r.includes(id)){r.push(id);st.set("dn_read_"+me.id,r);const dt=d.querySelector(".dot");if(dt)dt.remove();const b=document.querySelector(".bdg");if(b){const u=unread();u?b.textContent=u:b.remove()}}}));
  const pn=$("#pn");if(pn)pn.onclick=()=>{const t=$("#nti").value.trim(),x=$("#ntx").value.trim();if(!t||!x){toast("Заполните заголовок и текст");return}
   const a=st.get("dn_news",[]);a.unshift({id:"c"+Date.now(),t,x,d:0});st.set("dn_news",a);toast("Объявление опубликовано");render()}},
 profile(){$("#lo").onclick=()=>{ss.set(null);me=null;try{history.replaceState(null,"","#")}catch(e){}renderLogin()}}
};
window.addEventListener("hashchange",()=>{if(me){const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==view&&(NAV[me.role].some(x=>x[0]===h)||h==="profile")){view=h;openReq=null;render()}}});
start();
</script>
</body>
</html>
